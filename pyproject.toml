[project]
name = "vlog-script-generator"
version = "0.1.0"
description = "Local Chinese Vlog material analyzer and editing script generator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "pillow>=10.0",
  "opencv-python>=4.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vlog-script-generator = "vlog_script_generator.cli.app:main"

[tool.setuptools.packages.find]
include = ["vlog_script_generator", "vlog_script_generator.*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

